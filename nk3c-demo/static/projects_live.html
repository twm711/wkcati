<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目管理台 · Live（对接 nk3c-demo API）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; font-size: 13px; color: #333; }
  #app { display: flex; flex-direction: column; height: 100vh; min-width: 1100px; }
  .topbar { background: #14324f; color: #fff; display: flex; align-items: center; gap: 14px; padding: 8px 14px; flex: 0 0 auto; }
  .logo { font-size: 15px; font-weight: bold; letter-spacing: 1px; }
  .logo small { font-weight: normal; opacity: .7; margin-left: 6px; }
  .live-tag { background: #27863c; border-radius: 3px; font-size: 11px; padding: 1px 7px; font-weight: bold; }
  .spacer { flex: 1; }
  .chip { background: rgba(255,255,255,.12); border-radius: 14px; padding: 3px 12px; font-size: 12px; }
  .sbtn { border: 1px solid #c9d4e0; background: #fff; color: #4a6a94; border-radius: 4px; font-size: 12px; padding: 4px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
  .topbar a.sbtn { background: transparent; border-color: rgba(255,255,255,.4); color: #fff; }
  .main { flex: 1; display: flex; min-height: 0; }
  .col-l { flex: 0 0 360px; border-right: 1px solid #dfe4ea; background: #f2f5f9; display: flex; flex-direction: column; }
  .col-r { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .panel-h { padding: 8px 12px; font-weight: bold; color: #14324f; background: #eef3f9; border-bottom: 1px solid #dfe4ea; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .panel-h .tag { font-weight: normal; font-size: 11px; color: #7d8ca0; }
  .panel-h .r { margin-left: auto; font-weight: normal; }
  .plist { flex: 1; overflow-y: auto; padding: 10px; }
  .pcard { background: #fff; border: 1px solid #dfe4ea; border-radius: 6px; padding: 10px 12px; margin-bottom: 9px; cursor: pointer; }
  .pcard:hover { border-color: #6fc2ff; }
  .pcard.sel { border-color: #2e6da4; outline: 2px solid rgba(46,109,164,.18); }
  .pcard .ph { display: flex; align-items: center; gap: 8px; }
  .pcard .pn { font-weight: bold; color: #14324f; }
  .badge { margin-left: auto; font-size: 10.5px; color: #fff; border-radius: 8px; padding: 0 8px; }
  .b-RUNNING{background:#27863c} .b-DRAFT{background:#98a4b3} .b-PAUSED{background:#b9770e} .b-FINISHED{background:#7a8ba0}
  .pcard .pm { display: flex; justify-content: space-between; font-size: 11px; color: #7d8ca0; margin-top: 4px; }
  .pcard .q-t { display: flex; justify-content: space-between; font-size: 11px; color: #445; margin-top: 5px; }
  .q-bar { height: 6px; background: #eef1f5; border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .q-bar i { display: block; height: 100%; background: #2e6da4; }
  .q-bar i.hot { background: #e67e22; } .q-bar i.full { background: #27863c; }

  .dhead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .dhead b { font-size: 16px; color: #14324f; }
  .vchip { background: #eef3f9; border: 1px solid #d5e2ef; color: #2e6da4; border-radius: 10px; font-size: 11px; padding: 1px 10px; font-weight: bold; }
  .meta { color: #7d8ca0; font-size: 12px; margin-bottom: 12px; line-height: 1.8; }
  .meta b { color: #445; }
  .sec { font-weight: bold; color: #14324f; border-left: 3px solid #2e6da4; padding-left: 8px; margin: 16px 0 8px; font-size: 13.5px; }
  .qitem { background: #fff; border: 1px solid #e6ebf1; border-radius: 6px; padding: 8px 12px; margin-bottom: 7px; }
  .qitem .qh { display: flex; gap: 8px; align-items: center; }
  .qitem .qn { color: #2e6da4; font-family: Consolas, monospace; font-weight: bold; }
  .qitem .qt { font-size: 11px; color: #fff; background: #27863c; border-radius: 8px; padding: 0 8px; }
  .qitem .qt.number{background:#6c3fc5} .qitem .qt.text{background:#b9770e}
  .opts { margin: 5px 0 0 26px; font-size: 12px; color: #556; line-height: 1.7; }
  .opts i { font-style: normal; display: inline-block; border: 1px solid #e0e7ee; border-radius: 10px; padding: 0 8px; margin: 2px 4px 0 0; background: #f8fafc; }
  .citem { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #e6ebf1; border-radius: 6px; padding: 7px 12px; margin-bottom: 6px; font-size: 12.5px; }
  .citem .cond { color: #556; font-family: Consolas, monospace; font-size: 11.5px; }
  .citem .tgt { margin-left: auto; font-weight: bold; color: #14324f; }
  .mini-bar { width: 110px; height: 6px; background: #eef1f5; border-radius: 3px; overflow: hidden; }
  .mini-bar i { display: block; height: 100%; background: #2e6da4; }
  .opsbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding: 10px 12px; background: #fff; border: 1px solid #e6ebf1; border-radius: 6px; }
  .abtn { border: 1px solid #d0d7de; background: #fff; color: #333; border-radius: 4px; padding: 6px 14px; cursor: pointer; font-size: 12.5px; }
  .abtn.primary { background: #2e6da4; border-color: #2e6da4; color: #fff; }
  .abtn.warn { border-color: #e0c9a0; color: #b9770e; }
  .abtn.danger { border-color: #e0b4b4; color: #c0392b; }
  .abtn:disabled { opacity: .45; cursor: not-allowed; }
  .formbox { background: #fff; border: 1px dashed #b9c6d4; border-radius: 6px; padding: 12px; margin-top: 10px; }
  .formbox h4 { font-size: 12.5px; color: #14324f; margin-bottom: 8px; }
  .frow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .frow label { color: #7d8ca0; font-size: 11.5px; flex: 0 0 70px; text-align: right; }
  .frow input[type=text], .frow input[type=number], .frow select, .frow textarea { border: 1px solid #d0d7de; border-radius: 4px; padding: 5px 8px; font-size: 12.5px; font-family: inherit; }
  .frow textarea { width: 100%; rows: 3; }
  .fchk { display: flex; gap: 6px; flex-wrap: wrap; }
  .fchk label { flex: 0 0 auto; border: 1px solid #d5e2ef; border-radius: 12px; padding: 2px 10px; cursor: pointer; font-size: 12px; color: #445; }
  .fchk label.on { background: #eaf3fb; border-color: #2e6da4; color: #2e6da4; }
  .tip { color: #b9770e; font-size: 12px; margin-top: 6px; }
  .okmsg { color: #27863c; font-size: 12.5px; margin-top: 6px; }
  .err { color: #c0392b; font-size: 12.5px; margin-top: 6px; }
  .empty { color: #98a4b3; font-size: 12.5px; padding: 20px; text-align: center; }
  .toast { position: fixed; top: 60px; right: 18px; z-index: 60; background: #14324f; color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.25); display: none; max-width: 380px; }
  .toast.err { background: #c0392b; } .toast.ok { background: #27863c; }
  .mask { position: fixed; inset: 0; background: rgba(15,30,50,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 6px; width: 360px; max-width: 90vw; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  .modal .mhead { padding: 14px 16px; border-bottom: 1px solid #eef1f5; font-weight: bold; color: #14324f; }
  .modal .mbody { padding: 14px 16px; }
  .modal .mbody input { width: 100%; border: 1px solid #d0d7de; border-radius: 4px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
  .modal .mfoot { padding: 10px 16px; border-top: 1px solid #eef1f5; text-align: right; }
  .modal .merr { color: #c0392b; font-size: 12px; min-height: 16px; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">项目管理台 <small>对接 nk3c-demo API</small></div>
    <span class="live-tag">LIVE</span>
    <div class="spacer"></div>
    <div class="chip" id="userChip">未签入</div>
    <a class="sbtn" href="/agent">坐席台</a>
    <a class="sbtn" href="/supervisor">督导台</a>
    <a class="sbtn" href="/ivr">IVR 设计器</a>
  </div>
  <div class="main">
    <div class="col-l">
      <div class="panel-h">项目列表
        <span class="tag">GET /api/project</span>
        <span class="r"><button class="sbtn" onclick="createProject()">＋ 新建项目</button></span>
      </div>
      <div class="plist" id="plist"><div class="empty">签入后加载项目</div></div>
    </div>
    <div class="col-r" id="detail"><div class="empty">← 点击左侧项目查看详情与操作</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* 项目管理台 Live 版：创建→加题→配额→发布→导样→修订(v1.x+1)→暂停/结束 全生命周期可视化
 * 端点：GET/POST /api/project、GET /api/project/{pid}、POST .../questions、
 *       PUT .../quota、POST .../publish、POST .../samples、POST .../revise、POST .../status */
var token = '', me = null, projects = [], cur = null, detail = null;
var quotaDraft = [];          // 本地配额格草稿（保存时整组替换）
var formMode = null;          // null / 'addq'(DRAFT) / 'revise'(RUNNING) / 'quota' / 'import'
var REVISE_HINT = '修订将发布问卷新版本（v1.x → v1.x+1）：已答答卷保留旧版本快照，新话务按新版本执行。';

function $id(x){ return document.getElementById(x); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg, cls, ms){
  var t=$id('toast'); t.innerHTML=msg; t.className='toast '+(cls||''); t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(function(){t.style.display='none';}, ms||4200);
}
async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json'},
    token ? {'Authorization':'Bearer '+token} : {}, opts.headers||{});
  if (opts.body && typeof opts.body!=='string') opts.body = JSON.stringify(opts.body);
  var res;
  try { res = await fetch(path, opts); }
  catch(e){ toast('无法连接 API：请在【NK3C 演示系统】预览中打开','err',6000); throw e; }
  if (res.status===401){ showLogin('会话失效，请重新签入'); throw new Error('401'); }
  return await res.json();
}

/* ── 登录 ── */
function showLogin(msg){
  $id('modalRoot').innerHTML = '<div class="mask"><div class="modal">'+
    '<div class="mhead">签入 · 项目管理台</div><div class="mbody">'+
    '<div class="merr" id="lgErr">'+(msg?esc(msg):'')+'</div>'+
    '<input id="lgName" value="admin" placeholder="登录名（admin / sup01）">'+
    '<input id="lgPass" type="password" value="123456" placeholder="密码">'+
    '<div class="empty" style="padding:4px 0 0">查看任意账号可用；创建/发布/修订/状态变更需 groupAdmin+（admin / sup01）</div></div>'+
    '<div class="mfoot"><button class="abtn" onclick="closeModal()">取消</button>'+
    '<button class="abtn primary" id="lgBtn" onclick="doLogin()">签 入</button></div></div></div>';
}
async function doLogin(){
  $id('lgErr').textContent='';
  try{
    var r=await api('/api/auth/login',{method:'POST',body:{loginName:$id('lgName').value.trim(),password:$id('lgPass').value}});
    if(!r.success){ $id('lgErr').textContent=r.message; return; }
    token=r.data.sessionId; me=r.data; closeModal();
    $id('userChip').textContent=me.userName+' · '+me.roles.join('/');
    loadList();
  }catch(e){ $id('lgErr').textContent='网络异常'; }
}
function closeModal(){ $id('modalRoot').innerHTML=''; }

/* ── 列表 ── */
async function loadList(){
  var r = await api('/api/project');
  if(!r.success){ toast('加载失败：'+esc(r.message),'err'); return; }
  projects = r.data;
  var h = projects.map(function(p){
    var pct = p.quota.target ? Math.round(p.quota.done/p.quota.target*100) : 0;
    var cls = pct>=100?'full':(pct>=90?'hot':'');
    return '<div class="pcard'+(cur===p.projectId?' sel':'')+'" onclick="selectProject('+p.projectId+')">'+
      '<div class="ph"><span class="pn">'+esc(p.name)+'</span><span class="badge b-'+esc(p.status)+'">'+esc(p.status)+'</span></div>'+
      '<div class="pm"><span>问卷 '+esc(p.qnrVersion||'-')+'('+esc(p.qnrStatus||'-')+')</span>'+
      '<span>样本可派 '+p.samples.idle+' / '+p.samples.total+'</span></div>'+
      (p.quota.target?'<div class="q-t"><span>配额进度</span><span>'+p.quota.done+' / '+p.quota.target+'</span></div>'+
      '<div class="q-bar"><i class="'+cls+'" style="width:'+Math.min(100,pct)+'%"></i></div>':'')+
      '</div>';
  }).join('');
  $id('plist').innerHTML = h || '<div class="empty">暂无项目，点右上角新建</div>';
}
async function selectProject(pid){
  cur = pid; formMode = null; quotaDraft = [];
  loadList();
  var r = await api('/api/project/'+pid);
  if(!r.success){ toast('详情加载失败：'+esc(r.message),'err'); return; }
  detail = r.data;
  renderDetail();
}
async function createProject(){
  if(!token){ showLogin(); return; }
  var name = prompt('新项目名称：','客户回访_2026Q4');
  if(!name) return;
  var r = await api('/api/project',{method:'POST',body:{name:name}});
  if(!r.success){ toast('创建失败：'+esc(r.message),'err'); return; }
  toast(r.message,'ok');
  await loadList();
  selectProject(r.data.projectId);
}

/* ── 详情 ── */
function typeCn(t){ return {single:'单选',number:'数值',text:'文本'}[t]||t; }
function renderDetail(){
  var d = detail;
  var sm = d.samplesByStatus, smStr = Object.keys(sm).map(function(k){ return k+' '+sm[k]; }).join(' · ')||'无样本';
  var verStr = Object.keys(d.sheetVersions).map(function(k){ return k+'×'+d.sheetVersions[k]; }).join('，')||'暂无答卷';
  var h = '<div class="dhead"><b>'+esc(d.name)+'</b>'+
    '<span class="badge b-'+esc(d.status)+'" style="font-size:12px;padding:2px 12px">'+esc(d.status)+'</span>'+
    '<span class="vchip">'+esc(d.qnrVersion)+' '+esc(d.qnrStatus)+'</span></div>'+
    '<div class="meta">问卷 ID <b>'+d.questionnaireId+'</b> · 样本：<b>'+esc(smStr)+'</b> · 答卷版本分布：<b>'+esc(verStr)+'</b></div>';

  h += '<div class="sec">问卷题目（'+d.questions.length+'）</div>';
  h += d.questions.length ? d.questions.map(function(q){
    var opts = (q.options||[]).map(function(o){ return '<i>'+esc(o.text)+'</i>'; }).join('');
    if(q.type==='number') opts = '<i>范围 '+q.min+' ~ '+q.max+'</i>';
    if(q.type==='text') opts = '<i>开放作答</i>';
    return '<div class="qitem"><div class="qh"><span class="qn">Q'+q.qNo+'</span>'+
      '<span class="qt '+esc(q.type)+'">'+typeCn(q.type)+'</span><b>'+esc(q.title)+'</b></div>'+
      '<div class="opts">'+opts+'</div></div>';
  }).join('') : '<div class="empty">尚无题目（DRAFT 状态下点下方【加题】）</div>';

  h += '<div class="sec">配额格（'+d.quotaCells.length+'）</div>';
  h += d.quotaCells.length ? d.quotaCells.map(function(c){
    var pct = c.target?Math.round(c.done/c.target*100):0;
    var cond = c.conditions.map(function(cd){ return 'Q'+cd.questionId+'∈['+cd.in.join(',')+']'; }).join(' 且 ');
    return '<div class="citem"><span class="cond">'+esc(cond)+'</span>'+
      '<span class="mini-bar"><i style="width:'+Math.min(100,pct)+'%"></i></span>'+
      '<span class="tgt">'+c.done+' / '+c.target+'</span></div>';
  }).join('') : '<div class="empty">未设置配额（可选项，不设配额=不限量）</div>';

  h += '<div class="opsbar">'+opsHtml()+'</div>';
  h += '<div id="formArea"></div>';
  $id('detail').innerHTML = h;
}
function opsHtml(){
  var st = detail.status, admin = me && (me.roles.indexOf('groupAdmin')>=0||me.roles.indexOf('orgAdmin')>=0||me.roles.indexOf('domainAdmin')>=0);
  if(!admin) return '<span class="tip">当前账号无管理权限（需 groupAdmin+），仅可查看</span>';
  var b = '';
  if(st==='DRAFT') b = '<button class="abtn primary" onclick="showForm(\'addq\')">＋ 加题</button>'+
    '<button class="abtn" onclick="showForm(\'quota\')">⚙ 设置配额'+(quotaDraft.length?('（草稿 '+quotaDraft.length+' 格）'):(''))+'</button>'+
    '<button class="abtn" onclick="publish()" '+(detail.questions.length?'':'disabled')+'>🚀 发布（v1.0 RUNNING）</button>';
  else if(st==='RUNNING') b = '<button class="abtn primary" onclick="showForm(\'revise\')">✏ 修订问卷（版本+0.1）</button>'+
    '<button class="abtn" onclick="showForm(\'import\')">📥 导入样本</button>'+
    '<button class="abtn warn" onclick="setStatus(\'pause\')">⏸ 暂停</button>'+
    '<button class="abtn danger" onclick="setStatus(\'finish\')">⏹ 结束</button>';
  else if(st==='PAUSED') b = '<button class="abtn primary" onclick="setStatus(\'resume\')">▶ 恢复运行</button>'+
    '<button class="abtn" onclick="showForm(\'import\')">📥 导入样本</button>'+
    '<button class="abtn danger" onclick="setStatus(\'finish\')">⏹ 结束</button>';
  else b = '<span class="tip">项目已结束（FINISHED 终态）：仅可查看</span>';
  return b;
}

/* ── 表单区 ── */
function showForm(mode){
  formMode = mode;
  var area = $id('formArea');
  if(mode==='addq'||mode==='revise'){
    var title = mode==='addq' ? '加题（写入当前问卷草稿）' : '修订问卷（'+esc(detail.qnrVersion)+' → 新版本）';
    area.innerHTML = '<div class="formbox"><h4>'+title+'</h4>'+
      '<div class="frow"><label>题干</label><input type="text" id="fqText" style="flex:1" placeholder="例如：您是否愿意推荐本服务？"></div>'+
      '<div class="frow"><label>题型</label><select id="fqType" onchange="fqTypeChange()">'+
      '<option value="single">单选</option><option value="number">数值</option><option value="text">文本</option></select>'+
      '<span id="fqRange" style="display:none">范围 <input type="number" id="fqMin" style="width:64px" value=0> ~ <input type="number" id="fqMax" style="width:64px" value=10></span></div>'+
      '<div class="frow" id="fqOptsRow"><label>选项</label><input type="text" id="fqOpts" style="flex:1" placeholder="逗号分隔，如：满意,一般,不满意"></div>'+
      (mode==='revise'?'<div class="tip">'+REVISE_HINT+'</div>':'')+
      '<div class="frow" style="margin-top:6px"><label></label>'+
      '<button class="abtn primary" onclick="submitQuestion()">提交'+(mode==='revise'?'并发布新版本':'')+'</button>'+
      '<button class="abtn" onclick="closeForm()">收起</button><span id="fqMsg"></span></div></div>';
  } else if(mode==='quota'){
    var singles = detail.questions.filter(function(q){ return q.type==='single'; });
    area.innerHTML = '<div class="formbox"><h4>设置配额（按作答组合限量；保存为整组替换）</h4>'+
      (singles.length?'<div class="frow"><label>配额题</label><select id="cqQ" onchange="renderCqOpts()">'+
        singles.map(function(q){ return '<option value="'+q.questionId+'">'+esc(q.title)+'</option>'; }).join('')+
        '</select></div>'+
        '<div class="frow"><label>命中选项</label><span class="fchk" id="cqOpts"></span></div>'+
        '<div class="frow"><label>目标份数</label><input type="number" id="cqTarget" value="2" style="width:80px" min=1>'+
        '<button class="abtn" onclick="addQuotaCell()">＋加入草稿</button></div>'+
        '<div id="cqDraft"></div>'+
        '<div class="frow" style="margin-top:6px"><label></label>'+
        '<button class="abtn primary" onclick="saveQuota()" '+(quotaDraft.length?'':'disabled')+'>💾 保存配额（'+quotaDraft.length+' 格）</button>'+
        '<button class="abtn" onclick="closeForm()">收起</button><span id="cqMsg"></span></div>'
        :'<div class="tip">先加一道单选题才能设置配额</div>')+'</div>';
    renderCqOpts(); renderCqDraft();
  } else if(mode==='import'){
    area.innerHTML = '<div class="formbox"><h4>导入样本（同项目内号码查重，重复自动跳过）</h4>'+
      '<div class="frow"><label>客户名单</label><textarea id="imNames" rows="4" style="flex:1" placeholder="每行一个客户姓名，例如：&#10;客户甲&#10;客户乙"></textarea></div>'+
      '<div class="frow"><label>号码(可选)</label><textarea id="imPhones" rows="2" style="flex:1" placeholder="可选：与名单等长、每行一个；缺省按 ID 自动派生"></textarea></div>'+
      '<div class="frow"><label></label><button class="abtn primary" onclick="doImport()">导入</button>'+
      '<button class="abtn" onclick="closeForm()">收起</button><span id="imMsg"></span></div></div>';
  }
}
function closeForm(){ formMode=null; $id('formArea').innerHTML=''; }
function fqTypeChange(){
  var t=$id('fqType').value;
  $id('fqOptsRow').style.display = t==='single'?'flex':'none';
  $id('fqRange').style.display = t==='number'?'inline':'none';
}
async function submitQuestion(){
  var body = {text:$id('fqText').value.trim(), qType:$id('fqType').value};
  if(!body.text){ $id('fqMsg').className='err'; $id('fqMsg').textContent='题干不能为空'; return; }
  if(body.qType==='single') body.options = $id('fqOpts').value.split(/[,，]/).map(function(x){return x.trim();}).filter(Boolean);
  if(body.qType==='number'){ body.min=parseFloat($id('fqMin').value); body.max=parseFloat($id('fqMax').value); }
  var url = formMode==='addq' ? ('/api/project/'+cur+'/questions') : ('/api/project/'+cur+'/revise');
  var r = await api(url, {method:'POST', body: formMode==='addq' ? body : {addQuestions:[body]}});
  $id('fqMsg').className = r.success?'okmsg':'err';
  $id('fqMsg').textContent = r.message;
  if(r.success){ setTimeout(function(){ selectProject(cur); }, 900); }
}
function renderCqOpts(){
  var qid = parseInt($id('cqQ').value,10);
  var q = detail.questions.find(function(x){ return x.questionId===qid; });
  $id('cqOpts').innerHTML = q.options.map(function(o){
    return '<label onclick="this.classList.toggle(\'on\')"><input type="checkbox" value="'+o.optionId+'" style="display:none">'+esc(o.text)+'</label>';
  }).join('');
}
function renderCqDraft(){
  var el=$id('cqDraft');
  if(el) el.innerHTML = quotaDraft.length ? quotaDraft.map(function(c,i){
    var q = detail.questions.find(function(x){ return x.questionId===c.questionId; });
    var texts = c.inList.map(function(oid){ var o=q.options.find(function(y){return y.optionId===oid;}); return o?o.text:oid; });
    return '<div class="citem"><span class="cond">'+esc(q.title)+' ∈ ['+esc(texts.join(','))+']</span>'+
      '<span class="tgt">'+c.target+' 份</span><button class="abtn" style="padding:2px 8px" onclick="rmCell('+i+')">✕</button></div>';
  }).join('') : '<div class="tip">尚未加入配额格</div>';
  var save=$id('cqSaveBtn');
}
function addQuotaCell(){
  var qid = parseInt($id('cqQ').value,10);
  var inList = Array.prototype.slice.call($id('cqOpts').querySelectorAll('input:checked')).map(function(x){return parseInt(x.value,10);});
  var target = parseInt($id('cqTarget').value,10);
  if(!inList.length || !target){ toast('请勾选命中选项并填目标份数','err'); return; }
  quotaDraft.push({questionId:qid, inList:inList, target:target});
  renderCqDraft();
  var btn=document.querySelector('.opsbar'); // 刷新草稿计数提示
  showForm('quota');
}
function rmCell(i){ quotaDraft.splice(i,1); showForm('quota'); }
async function saveQuota(){
  var r = await api('/api/project/'+cur+'/quota', {method:'PUT', body:{name:'配额', cells:quotaDraft}});
  $id('cqMsg').className = r.success?'okmsg':'err';
  $id('cqMsg').textContent = r.message;
  if(r.success){ quotaDraft=[]; setTimeout(function(){ selectProject(cur); }, 900); }
}
async function publish(){
  if(!confirm('发布后问卷版本冻结（v1.0 PUBLISHED），项目进入 RUNNING 开始派样。确认发布？')) return;
  var r = await api('/api/project/'+cur+'/publish', {method:'POST', body:{}});
  toast(r.success?r.message:('发布失败：'+esc(r.message)), r.success?'ok':'err', 6000);
  if(r.success){ setTimeout(function(){ selectProject(cur); }, 900); }
}
async function setStatus(action){
  var names = {pause:'暂停', resume:'恢复运行', finish:'结束'};
  if(action==='finish' && !confirm('结束后项目为终态，不可再变更。确认结束？')) return;
  var r = await api('/api/project/'+cur+'/status', {method:'POST', body:{action:action}});
  toast(r.success?r.message:('操作失败：'+esc(r.message)), r.success?'ok':'err', 6000);
  if(r.success){ setTimeout(function(){ selectProject(cur); }, 900); }
}
async function doImport(){
  var names = $id('imNames').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  var phones = $id('imPhones').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  if(!names.length){ $id('imMsg').className='err'; $id('imMsg').textContent='名单不能为空'; return; }
  var body = {names:names};
  if(phones.length) body.phones = phones;
  var r = await api('/api/project/'+cur+'/samples', {method:'POST', body:body});
  $id('imMsg').className = r.success?'okmsg':'err';
  $id('imMsg').textContent = r.message;
  if(r.success){ setTimeout(function(){ selectProject(cur); }, 1200); }
}

showLogin();
</script>
</body>
</html>
